our_clients.settings:
  type: config_object
  label: 'Our clients settings'
  mapping:
    heading:
      type: label
      label: 'Block heading'
    heading_font_size:
      type: integer
      label: 'Heading font size (px)'
    heading_font_size_mobile:
      type: integer
      label: 'Heading font size on mobile (px)'
    heading_margin_top:
      type: integer
      label: 'Heading margin top (px)'
    heading_margin_bottom:
      type: integer
      label: 'Heading margin bottom (px)'
    button_text_color:
      type: string
      label: 'Button text color'
    button_background:
      type: string
      label: 'Button background'
    button_hover_background:
      type: string
      label: 'Button hover background'
    button_border_radius:
      type: integer
      label: 'Button border radius (px)'
    button_font_size:
      type: integer
      label: 'Button font size (px)'
    button_font_size_mobile:
      type: integer
      label: 'Button font size on mobile (px)'
    button_height:
      type: integer
      label: 'Button height (px)'
    button_height_mobile:
      type: integer
      label: 'Button height on mobile (px)'
    button_padding_x:
      type: integer
      label: 'Button horizontal padding (px)'
    visible_desktop:
      type: integer
      label: 'Visible slides on desktop'
    visible_tablet:
      type: integer
      label: 'Visible slides on tablet'
    visible_mobile:
      type: integer
      label: 'Visible slides on mobile'
    autoplay:
      type: boolean
      label: 'Autoplay'
    autoplay_speed:
      type: integer
      label: 'Autoplay interval (ms)'
    slider_max_width:
      type: integer
      label: 'Slider maximum width (px)'
    image_height:
      type: integer
      label: 'Slide image height (px)'
    image_height_mobile:
      type: integer
      label: 'Slide image height on mobile (px)'
    name_font_size:
      type: integer
      label: 'Client name font size (px)'
    modal_width:
      type: integer
      label: 'Modal window width (px)'
    accent_color:
      type: string
      label: 'Accent color'

our_clients.slide.*:
  type: config_entity
  label: 'Our clients slide'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Client name'
    image_media:
      type: integer
      label: 'Image media ID'
    description:
      type: mapping
      label: 'Description'
      mapping:
        value:
          type: text
          label: 'Value'
        format:
          type: string
          label: 'Text format'
    reviews:
      type: sequence
      label: 'Reviews'
      sequence:
        type: string
    weight:
      type: integer
      label: 'Weight'
    status:
      type: boolean
      label: 'Published'
    uuid:
      type: string
      label: 'UUID'
    langcode:
      type: string
      label: 'Language code'

our_clients.review.*:
  type: config_entity
  label: 'Our clients review'
  mapping:
    id:
      type: string
      label: 'ID'
    author:
      type: label
      label: 'Author name'
    date:
      type: string
      label: 'Review date'
    city:
      type: label
      label: 'City'
    rating:
      type: integer
      label: 'Rating'
    text:
      type: text
      label: 'Review text'
    uuid:
      type: string
      label: 'UUID'
    langcode:
      type: string
      label: 'Language code'
